upstream lingdong_api_cluster {
    least_conn;
    server api-1:8280 max_fails=3 fail_timeout=15s;
    server api-2:8280 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location /api/ {
        proxy_pass http://lingdong_api_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location /mcp {
        proxy_pass http://lingdong_api_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://lingdong_api_cluster/health;
    }

    location = /readyz {
        proxy_pass http://lingdong_api_cluster/readyz;
    }

    location = /metrics {
        proxy_pass http://lingdong_api_cluster/metrics;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
