services:
  postgres:
    image: postgres:17-alpine
    container_name: lingdong-v3-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lingdong
      POSTGRES_PASSWORD: lingdong_v3_dev_password
      POSTGRES_DB: ontology_v3
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - v3_pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingdong -d ontology_v3"]
      interval: 5s
      timeout: 3s
      retries: 10

  elk-sidecar:
    profiles: ["elk"]
    build:
      context: ./services/elk-sidecar
    container_name: lingdong-v3-elk-sidecar
    restart: unless-stopped
    ports:
      - "127.0.0.1:8281:8281"

volumes:
  v3_pgdata:

networks:
  default:
    ipam:
      config:
        - subnet: 10.249.88.0/24

